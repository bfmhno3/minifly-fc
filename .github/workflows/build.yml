name: Build Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build

      - name: Configure
        run: cmake --preset Release

      - name: Build
        run: cmake --build build/Release

      - name: Generate bin and hex
        run: |
          arm-none-eabi-objcopy -O binary build/Release/minifly-fc.elf build/Release/minifly-fc.bin
          arm-none-eabi-objcopy -O ihex build/Release/minifly-fc.elf build/Release/minifly-fc.hex

      - name: Print size
        run: arm-none-eabi-size build/Release/minifly-fc.elf

      - uses: actions/upload-artifact@v4
        with:
          name: minifly-fc-Release
          path: |
            build/Release/minifly-fc.elf
            build/Release/minifly-fc.bin
            build/Release/minifly-fc.hex

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: minifly-fc-Release
          path: artifacts/minifly-fc-Release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/minifly-fc-Release/*